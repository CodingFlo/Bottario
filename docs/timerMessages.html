
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer-Nachrichten von Bottario</title>
    
    <link rel="stylesheet" href="css/colors.css" />
    <link rel="stylesheet" href="css/timerMessages.css">
    <link rel="stylesheet" href="css/shared.css" />
</head>
<body>
    <!-- Canvas für den animierten Hintergrund -->
    <canvas id="background-canvas"></canvas>

    <h1 style="animation-delay: 0.2s;">Timer-Nachrichten von Bottario</h1>
    
    <div class="header-button-wrapper fade-in">
        <a href="index.html" class="home-button">
            ← Zurück zur Startseite
        </a>
    </div>

    <div class="info-container" style="animation-delay: 0.4s;">
        <span>Intervall: 30 Minuten</span>
        <span>Mind. Nachrichten: 30</span>
    </div>
    <div class="messages-container">
        <div class="header-card" style="animation-delay: 0.6s;">Nachrichten</div>
        
        <div class="info-card" style="animation-delay: 0.8s;">
            <h2>24h Stream</h2>
            <p>Du willst wissen was alles im 24h Stream geschehen wird? Dann click hier auf den Link! :D  https://www.youtube.com/post/UgkxdAuovDe6PliEoZo-FxDM3UoRsO5gRKjz</p>
        </div>
    </div>
   
    <script src="js/backgroundScript.js"></script>
    <script src="js/applySequentialAnimations.js" defer></script>
</body>
</html>
